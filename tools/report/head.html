<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #0D1117;
    --paper:      #F5F0E8;
    --deep-navy:  #0A1628;
    --mid-navy:   #1B3A6B;
    --steel:      #2E75B6;
    --gold:       #C8973A;
    --gold-light: #F0D090;
    --green:      #1A6B35;
    --red:        #A01020;
    --muted:      #6B7280;
    --rule:       #C4B89A;
    --highlight:  #EDF4FD;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ── MASTHEAD ── */
  .masthead { background: var(--deep-navy); color: #fff; position: relative; overflow: hidden; }
  .masthead::before {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0 1px, transparent 1px 60px);
  }
  .masthead-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 56px 40px 0; }
  .report-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .15em; color: var(--gold-light); text-transform: uppercase; margin-bottom: 16px; }
  .report-title { font-family: 'Playfair Display', serif; font-size: clamp(38px, 5vw, 64px); font-weight: 900; line-height: 1.05; letter-spacing: -.02em; color: #fff; }
  .report-title span { color: var(--gold); }
  .report-subtitle { font-size: 16px; color: rgba(255,255,255,.55); margin-top: 10px; font-weight: 300; }
  .kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; margin-top: 40px; background: rgba(255,255,255,.1); border-top: 1px solid rgba(255,255,255,.12); }
  .kpi-cell { background: rgba(10,22,40,.7); padding: 18px 20px; text-align: center; }
  .kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 6px; }
  .kpi-value { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--gold-light); }
  .rating-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: rgba(255,255,255,.08); border-top: 1px solid rgba(255,255,255,.08); }
  .rating-cell { padding: 16px 24px; text-align: center; }
  .rating-cell.buy  { background: rgba(26,107,53,.4); }
  .rating-cell.bull { background: rgba(46,117,182,.25); }
  .rating-cell.bear { background: rgba(160,16,32,.2); }
  .rating-tag { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 4px; }
  .rating-val { font-size: 15px; font-weight: 600; color: #fff; }

  /* ── LAYOUT ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 0 40px 80px; }

  /* ── NAV ── */
  .toc { position: sticky; top: 0; z-index: 100; background: var(--deep-navy); border-bottom: 2px solid var(--gold); overflow-x: auto; }
  .toc-inner { max-width: 1100px; margin: 0 auto; padding: 0 40px; display: flex; gap: 0; }
  .toc a { display: block; padding: 12px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.5); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; }
  .toc a:hover { color: var(--gold-light); border-bottom-color: var(--gold); }

  /* ── SECTIONS ── */
  .section { padding: 48px 0 24px; border-bottom: 1px solid var(--rule); }
  .section:last-child { border-bottom: none; }
  .section-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 28px; }
  .section-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; color: var(--gold); flex-shrink: 0; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--mid-navy); line-height: 1.2; }
  .subsection-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--steel); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  p { margin-bottom: 12px; }
  p:last-child { margin-bottom: 0; }

  /* ── TABLES ── */
  .tbl-wrap { overflow-x: auto; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: var(--deep-navy); color: #fff; }
  thead th { padding: 11px 14px; text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
  thead th.right { text-align: right; }
  tbody tr:nth-child(even) { background: rgba(46,117,182,.05); }
  tbody tr:hover { background: rgba(200,151,58,.08); }
  tbody td { padding: 9px 14px; border-bottom: 1px solid rgba(196,184,154,.3); vertical-align: top; }
  tbody td.right { text-align: right; }
  tbody td.bold  { font-weight: 600; color: var(--mid-navy); }
  tbody td.green { color: var(--green); font-weight: 600; }
  tbody td.red   { color: var(--red);   font-weight: 600; }
  tbody td.muted { color: var(--muted); }
  .tbl-note { font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 6px; }

  /* ── CALLOUTS ── */
  .callout { border-left: 3px solid var(--steel); padding: 14px 20px; background: var(--highlight); margin: 16px 0; font-style: italic; font-size: 13.5px; color: #2a3a50; border-radius: 0 4px 4px 0; }
  .callout-gold { border-left: 3px solid var(--gold); background: #FAF5E8; color: #4a3500; }
  .callout-green { border-left: 3px solid var(--green); background: #F0F8F2; color: #1A3A24; }
  .callout-red { border-left: 3px solid var(--red); background: #FDF0F0; color: #4a0010; }
  .info-box { background: var(--deep-navy); color: #fff; padding: 20px 24px; margin: 20px 0; border-radius: 2px; }
  .info-box p { color: rgba(255,255,255,.8); }

  /* ── BULLET LISTS ── */
  ul.report-list { list-style: none; padding: 0; margin: 10px 0; }
  ul.report-list li { padding: 5px 0 5px 20px; position: relative; border-bottom: 1px solid rgba(196,184,154,.2); font-size: 13.5px; }
  ul.report-list li::before { content: '▸'; position: absolute; left: 0; color: var(--gold); font-size: 10px; top: 7px; }
  ul.report-list li:last-child { border-bottom: none; }
  ul.report-list li strong { color: var(--mid-navy); }

  /* ── VALUE CHAIN ── */
  .vc-diagram { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 24px 0; border: 1px solid var(--rule); overflow: hidden; border-radius: 4px; }
  .vc-layer { padding: 20px 16px; text-align: center; position: relative; }
  .vc-layer::after { content: '▶'; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 14px; z-index: 2; }
  .vc-layer:last-child::after { display: none; }
  .vc-layer.l1 { background: #0A1628; color: #fff; }
  .vc-layer.l2 { background: #1B3A6B; color: #fff; }
  .vc-layer.l3 { background: #2E75B6; color: #fff; }
  .vc-layer.l4 { background: #5B9BD5; color: #fff; }
  .vc-num { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .12em; opacity: .6; margin-bottom: 6px; }
  .vc-name { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .vc-desc { font-size: 11px; opacity: .85; line-height: 1.4; margin-bottom: 10px; }
  .vc-tags { display: flex; flex-direction: column; gap: 4px; }
  .vc-tag { font-size: 10px; padding: 3px 8px; border-radius: 2px; background: rgba(255,255,255,.15); font-family: 'IBM Plex Mono', monospace; }
  .vc-tag.skip { background: var(--gold); color: var(--deep-navy); font-weight: 600; }

  /* ── MACRO CARDS ── */
  .macro-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 20px 0; }
  .macro-card { background: var(--deep-navy); color: #fff; padding: 20px; border-radius: 3px; position: relative; overflow: hidden; }
  .macro-card::before { content: ''; position: absolute; top: 0; right: 0; width: 60px; height: 60px; background: rgba(200,151,58,.15); border-radius: 0 0 0 60px; }
  .macro-co { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: var(--gold-light); margin-bottom: 4px; }
  .macro-val { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #fff; }
  .macro-label { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 2px; }

  /* ── SCENARIO CARDS ── */
  .scenario-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
  .scenario-card { border-radius: 4px; overflow: hidden; }
  .sc-header { padding: 16px 20px; color: #fff; font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; }
  .sc-header.bull { background: var(--green); }
  .sc-header.bear { background: var(--red); }
  .sc-body { padding: 16px 20px; border: 1px solid var(--rule); border-top: none; }
  .sc-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(196,184,154,.3); font-size: 13px; gap: 14px; }
  .sc-row:last-child { border-bottom: none; }
  .sc-key { color: var(--muted); flex-shrink: 0; }
  .sc-val { font-weight: 600; color: var(--ink); text-align: right; }
  .sc-val.green { color: var(--green); }
  .sc-val.red   { color: var(--red); }

  /* ── RISK GRID ── */
  .risk-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 16px 0; }
  .risk-row { display: grid; grid-template-columns: 28px 240px 90px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; font-size: 13px; }
  .risk-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); padding-top: 2px; }
  .risk-name { font-weight: 600; color: var(--mid-navy); }
  .risk-body { color: #3a3a3a; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: .06em; padding: 3px 9px; border-radius: 2px; text-transform: uppercase; height: fit-content; }
  .badge-high { background: #FFE4E4; color: var(--red); }
  .badge-med  { background: #FFF4CC; color: #7B6000; }
  .badge-low  { background: #E4F2E8; color: var(--green); }
  .badge-medh { background: #FFE8CC; color: #8B4000; }

  /* ── THESIS BOX ── */
  .thesis-box { background: var(--deep-navy); color: #fff; padding: 32px 36px; margin: 24px 0; position: relative; overflow: hidden; }
  .thesis-box::before { content: '"'; position: absolute; top: -20px; left: 20px; font-family: 'Playfair Display', serif; font-size: 180px; color: rgba(200,151,58,.12); line-height: 1; pointer-events: none; }
  .thesis-box p { position: relative; z-index: 1; font-size: 15px; line-height: 1.75; color: rgba(255,255,255,.85); font-style: italic; }
  .thesis-box strong { color: var(--gold-light); font-style: normal; }

  /* ── MONITORABLES ── */
  .monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .monitor-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: #fff; border: 1px solid var(--rule); border-radius: 3px; font-size: 13px; }
  .monitor-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin-top: 5px; }

  /* ── VERDICT ── */
  .verdict-banner { background: linear-gradient(135deg, var(--mid-navy), var(--steel)); color: #fff; padding: 28px 36px; text-align: center; border-radius: 4px; margin: 28px 0; }
  .verdict-banner h3 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .verdict-banner p { color: rgba(255,255,255,.85); font-size: 14px; }

  /* ── FOOTER ── */
  .footer { background: var(--deep-navy); color: rgba(255,255,255,.4); font-size: 11px; padding: 24px 40px; text-align: center; font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em; line-height: 1.8; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .masthead-inner > * { animation: fadeInUp .6s ease both; }
  .masthead-inner > *:nth-child(1) { animation-delay: .05s; }
  .masthead-inner > *:nth-child(2) { animation-delay: .15s; }
  .masthead-inner > *:nth-child(3) { animation-delay: .22s; }

  @media print { .toc { display: none; } .section { page-break-inside: avoid; } }
  @media (max-width: 768px) {
    .page { padding: 0 20px 60px; }
    .masthead-inner { padding: 32px 20px 0; }
    .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    .vc-diagram, .macro-grid, .scenario-grid, .monitor-grid { grid-template-columns: 1fr; }
    .risk-row { grid-template-columns: 1fr; }
    .rating-bar { grid-template-columns: 1fr; }
  }
</style>
</head>
